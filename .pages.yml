media:
  input: public/images
  output: /images

content:
  - name: blog
    label: 文章
    type: collection
    path: content/blog
    filename: '{fields.slug}.mdx'
    format: yaml-frontmatter
    view:
      fields: [title, categories, publishedAt, draft]
    fields:
      - { name: title, label: 標題, type: string, required: true }
      - { name: slug, label: 網址（英文、連字號分隔，發佈後請勿更改）, type: string, required: true }
      - { name: excerpt, label: 摘要, type: text, required: true }
      - { name: coverImage, label: 封面圖片, type: image }
      - { name: publishedAt, label: 發佈日期, type: date, required: true }
      - { name: updatedAt, label: 更新日期, type: date }
      - { name: categories, label: 分類, type: string, list: true }
      - { name: tags, label: 標籤, type: string, list: true }
      - { name: draft, label: 草稿（勾選後不會出現在文章列表，但可用網址直接預覽）, type: boolean, default: true }
      - { name: body, label: 內容, type: rich-text }

  - name: about
    label: 關於頁面
    type: file
    path: content/about.mdx
    format: yaml-frontmatter
    fields:
      - { name: title, label: 標題, type: string, required: true }
      - { name: publishedAt, label: 建立日期, type: date, required: true }
      - { name: updatedAt, label: 更新日期, type: date }
      - { name: body, label: 內容, type: rich-text }

  - name: privacy-policy
    label: 隱私權政策
    type: file
    path: content/privacy-policy.mdx
    format: yaml-frontmatter
    fields:
      - { name: title, label: 標題, type: string, required: true }
      - { name: publishedAt, label: 建立日期, type: date, required: true }
      - { name: updatedAt, label: 更新日期, type: date }
      - { name: body, label: 內容, type: rich-text }

  - name: terms
    label: 服務條款
    type: file
    path: content/terms.mdx
    format: yaml-frontmatter
    fields:
      - { name: title, label: 標題, type: string, required: true }
      - { name: publishedAt, label: 建立日期, type: date, required: true }
      - { name: updatedAt, label: 更新日期, type: date }
      - { name: body, label: 內容, type: rich-text }

  - name: site
    label: 網站設定
    type: file
    path: data/site.json
    format: json
    fields:
      - { name: name, label: 網站名稱, type: string, required: true }
      - { name: description, label: 網站描述, type: text, required: true }
      - { name: heroImage, label: 首頁 Hero 圖片（不設定則不顯示圖片）, type: image }
      - name: author
        label: 作者
        type: object
        fields:
          - { name: name, label: 姓名, type: string, required: true }
          - { name: bio, label: 簡介, type: text }
      - name: socials
        label: 社群連結
        type: object
        fields:
          - { name: instagram, label: Instagram 連結, type: string }
          - { name: threads, label: Threads 連結, type: string }
          - { name: youtube, label: YouTube 連結, type: string }
      - { name: homepageLatestArticlesLimit, label: 首頁最新文章顯示筆數, type: number, required: true }
